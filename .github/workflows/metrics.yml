name: metrics

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  render-metrics:
    runs-on: ubuntu-latest
    permissions:             
      contents: write        
    steps: 

      - name: Metrics - Projeto Jogo 1
        uses: lowlighter/metrics@latest
        with:
          template: repository
          filename: metrics.projetojogo1.svg
          token: ${{ secrets.METRICS_TOKEN }}
          repo: swtt0y/projetojogo1 

      - name: Metrics - Projeto 2
        uses: lowlighter/metrics@latest
        with:
          template: repository
          filename: metrics.projeto2.svg
          token: ${{ secrets.METRICS_TOKEN }}
          repo: swtt0y/Projeto2 

      - name: Metrics - Jogo Resgate Pantanal
        uses: lowlighter/metrics@latest
        with:
          template: repository
          filename: metrics.jogo_resgate_pantanal.svg
          token: ${{ secrets.METRICS_TOKEN }}
          repo: swtt0y/Jogo_Resgate_Pantanal 

      - name: Metrics - Projeto em C
        uses: lowlighter/metrics@latest
        with:
          template: repository
          filename: metrics.projeto-em-c.svg
          token: ${{ secrets.METRICS_TOKEN }}
          repo: swtt0y/projeto-em-C 
    
  metrics-languages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: swtt0y
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
